# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties, the same as Lumio's
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.19.3

# Mod Properties
# The version, from which build.gradle builds the full one (SemVer): 1.0.0-beta.1, 1.0.0 for a release; shown as "1.0.0 Beta", "1.0.0". An alpha build has its build in it, 1.0.1-alpha+build.31,
# and only the developer has it.
# mod_version: MAJOR.MINOR.PATCH of the version in work (or released)
mod_version=1.0.0
# mod_stage: alpha, beta or release
mod_stage=beta
# mod_stage_number: only for beta: 1, 2, ...
mod_stage_number=1
# build_number: the build of the next jar copied to the game (deployJar raises it by 1 after copying); never set by hand, never lowered
build_number=64
group=dev.tim1337

# Dependencies
fabric_api_version=0.161.0+26.2
# Lumio from the local Maven repository (./gradlew publishToMavenLocal in Lumio): its API to compile against, the
# mod itself to run with
lumio_api_version=1.8.0
lumio_version=1.0.0-SNAPSHOT
# The public release of Lumio that the public repository's build checks out and builds against
lumio_tag=v1.0.0-beta.1
